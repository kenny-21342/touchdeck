name: TouchDeck
options:
  bundleIdPrefix: com.kennylhs
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "2"
    PRODUCT_NAME: TouchDeck
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: Native/Info.plist
targets:
  TouchDeck:
    type: application
    platform: iOS
    sources:
      - path: Native/TouchDeck
    info:
      path: Native/Info.plist
      properties:
        CFBundleDisplayName: TouchDeck
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: "TouchDeck connects to your Mac on your local Wi-Fi network to send trackpad and keyboard input."
        UIUserInterfaceStyle: Dark
        UILaunchScreen: {}
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kennylhs.touchdeck
        TARGETED_DEVICE_FAMILY: "2"
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_MACCATALYST: NO
